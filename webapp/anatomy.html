<!--

  Visual starting point: the reviewer's interactive diagram (organic
  organs inside a private membrane, relationship pathways, click-to-read
  detail); corrected to the written blueprint where they differ —
  Memory / Judgment Record at the center with the Owner beside it,
  Boundary & Critique in place of "Immune System", Vault / Restoration in
  place of "Regeneration", four named relationship classes, and no motion
  of any kind before a visible click.

  Everything drawn here comes from ONE data structure: the JSON in
  <script id="anatomy-data"> below — organs, laws, edges, story steps,
  and the geometry. The rendering code carries no labels of its own.
  No model call. No network request. Behind the pairing gate like every
  other page. The commit stamp is filled in by the route.
-->

<script>
// ---------------------------------------------------------------------
// Rendering only. Every label, law, edge, step, and coordinate above is
// data; the code below carries none of its own. No fetch. No timer
// before a click. Nothing loops.
const DATA = JSON.parse(document.getElementById('anatomy-data').textContent);
const NODES = Object.fromEntries(DATA.nodes.map(n => [n.id, n]));
const CLS = Object.fromEntries(DATA.relationship_classes.map(c => [c.id, c]));
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

const state = { step: -1, running: false, timer: null, selected: null, filter: 'all', view: 'diagram', viewChosen: false, story: 'source' };

document.getElementById('title').textContent = DATA.title;
document.getElementById('subtitle').textContent = DATA.subtitle;
document.getElementById('thesis').textContent = DATA.thesis;
document.getElementById('thesis-foot').textContent = DATA.thesis_foot;
document.getElementById('custody').textContent = 'as of ' + DATA.as_of + ' · commit __COMMIT__';

function goBack() {
  // Back returns to the exact Wordicon state the visitor left: the front
  // page keeps its own state, so history is enough; a direct visit falls
  // back to the front door.
  if (history.length > 1 && document.referrer && document.referrer.indexOf(location.host) !== -1) history.back();
  else location.href = '/';
}

// ---- story selector -------------------------------------------------
const storySel = document.getElementById('story');
DATA.stories.forEach(s => {
  const o = document.createElement('option');
  o.value = s.id; o.textContent = s.name + (s.available ? '' : ' — ' + s.why);
  o.disabled = !s.available;
  storySel.appendChild(o);
});
storySel.value = 'source';
storySel.onchange = () => { state.story = storySel.value; };
function story() { return DATA.stories.find(s => s.id === state.story); }

// ---- filters ----------------------------------------------------------
const filt = document.getElementById('filters');
[{id:'all', label:'Whole system'}].concat(DATA.relationship_classes).forEach(c => {
  const b = document.createElement('button');
  b.className = 'chip' + (c.id === 'all' ? ' on' : ''); b.dataset.cls = c.id;
  b.innerHTML = (c.id === 'all' ? '' : `<span class="swatch" style="border-color:var(--${c.id})"></span>`) + esc(c.label);
  b.onclick = () => { state.filter = c.id; [...filt.children].forEach(x => x.classList.toggle('on', x.dataset.cls === c.id)); applyEmphasis(); };
  filt.appendChild(b);
});
document.getElementById('legend').innerHTML = DATA.relationship_classes.map(c =>
  `<span class="swatch" style="border-color:var(--${c.id})"></span>${esc(c.label)}`).join(' &nbsp; ')
  + ' &nbsp; <span class="swatch" style="border-color:var(--unbuilt);border-top-style:dashed"></span>dashed grey pathway: future — the organ it touches is unbuilt';

// ---- geometry -----------------------------------------------------------
function blobPath(n) {
  // an organic organ outline: an ellipse whose four radii are nudged by a
  // deterministic seed, so no two organs share a silhouette
  const k = 0.5523, cx = n.x, cy = n.y;
  const j = i => 0.93 + ((Math.sin(n.seed * 7.3 + i * 2.1) + 1) / 2) * 0.14;
  const rR = n.w / 2 * j(0), rL = n.w / 2 * j(1), rT = n.h / 2 * j(2), rB = n.h / 2 * j(3);
  const f = v => v.toFixed(1);
  return `M${f(cx)} ${f(cy - rT)}`
    + ` C${f(cx + rR * k)} ${f(cy - rT)} ${f(cx + rR)} ${f(cy - rT * k)} ${f(cx + rR)} ${f(cy)}`
    + ` C${f(cx + rR)} ${f(cy + rB * k)} ${f(cx + rR * k)} ${f(cy + rB)} ${f(cx)} ${f(cy + rB)}`
    + ` C${f(cx - rL * k)} ${f(cy + rB)} ${f(cx - rL)} ${f(cy + rB * k)} ${f(cx - rL)} ${f(cy)}`
    + ` C${f(cx - rL)} ${f(cy - rT * k)} ${f(cx - rL * k)} ${f(cy - rT)} ${f(cx)} ${f(cy - rT)} Z`;
}
function clipToEllipse(from, to, n) {
  // where the line from `from` toward `to` leaves n's bounding ellipse
  const rx = n.w / 2 + 2, ry = n.h / 2 + 2;
  const dx = to.x - from.x, dy = to.y - from.y;
  const t = 1 / Math.sqrt((dx * dx) / (rx * rx) + (dy * dy) / (ry * ry) || 1);
  return {x: from.x + dx * t, y: from.y + dy * t};
}
function edgePath(e) {
  if (e.d) return e.d;
  const a = NODES[e.from], b = NODES[e.to];
  const via = e.via ? {x: e.via[0], y: e.via[1]} : {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2};
  const p = clipToEllipse({x: a.x, y: a.y}, via, a), q = clipToEllipse({x: b.x, y: b.y}, via, b);
  return `M${p.x.toFixed(1)} ${p.y.toFixed(1)} Q${via.x} ${via.y} ${q.x.toFixed(1)} ${q.y.toFixed(1)}`;
}

// ---- render ---------------------------------------------------------------
function render() {
  const stage = document.getElementById('stage');
  const W = DATA.canvas.w, H = DATA.canvas.h;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(DATA.title)}">`;
  s += '<defs>';
  ['feeds', 'challenges', 'preserves', 'future'].forEach(k => {
    s += `<marker id="arr-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--${k})"/></marker>`;
  });
  s += `<marker id="stop-constrained" viewBox="0 0 10 12" refX="7" refY="6" markerWidth="8" markerHeight="9" orient="auto"><path d="M7 0 L7 12" stroke="var(--constrained)" stroke-width="3"/></marker>`;
  s += `<marker id="stop-future" viewBox="0 0 10 12" refX="7" refY="6" markerWidth="8" markerHeight="9" orient="auto"><path d="M7 0 L7 12" stroke="var(--unbuilt)" stroke-width="3"/></marker>`;
  s += '</defs>';
  s += `<text class="membrane-label" x="${W / 2}" y="24" text-anchor="middle">${esc(DATA.membrane.top_label)}</text>`;
  s += `<path class="membrane" d="${DATA.membrane.path}"/>`;
  s += `<text class="membrane-label" x="${W / 2}" y="88" text-anchor="middle">${esc(DATA.membrane.label)}</text>`;
  // pathways, under the organs
  s += '<g aria-label="Relationship pathways">';
  DATA.edges.forEach((e, i) => {
    const cls = e.future ? 'future' : e.class;
    const marker = CLS[e.class].marker === 'stop' ? `url(#stop-${e.future ? 'future' : 'constrained'})` : `url(#arr-${cls})`;
    const fromName = e.from === 'world' ? 'the outside world' : NODES[e.from].name;
    s += `<path class="edge ${cls}" data-i="${i}" data-from="${e.from}" data-to="${e.to}" data-cls="${e.class}" marker-end="${marker}" d="${edgePath(e)}"><title>${esc(fromName)} — ${esc(CLS[e.class].label)} — ${esc(NODES[e.to].name)}${e.label ? ': ' + esc(e.label) : ''}${e.future ? ' (future: that organ is unbuilt)' : ''}</title></path>`;
    if (e.label && e.label_at) {
      const [lx, ly] = e.label_at;
      s += `<text class="relation-label" x="${lx}" y="${ly}" text-anchor="middle"${e.rotate ? ` transform="rotate(${e.rotate} ${lx} ${ly})"` : ''}>${esc(e.label)}</text>`;
    }
  });
  s += '</g>';
  // organs
  DATA.nodes.forEach(n => {
    const lines = [];
    s += `<g class="organ ${n.kind}" data-id="${n.id}" tabindex="0" role="button" aria-label="${esc(n.name)}, ${esc(n.status)}">`;
    s += `<path class="organ-shape" d="${blobPath(n)}"/>`;
    const hasCells = Array.isArray(n.cells) && n.cells.length;
    const hasLaw = !!n.on_organ_short;
    const y0 = n.y - (hasCells ? 30 : hasLaw ? 26 : 14);
    s += `<text class="organ-title" x="${n.x}" y="${y0}">${esc(n.name)}</text>`;
    if (hasCells) {
      const gap = 34, x0 = n.x - gap * (n.cells.length - 1) / 2;
      n.cells.forEach((c, i) => {
        s += `<circle class="room-cell" cx="${x0 + i * gap}" cy="${n.y - 3}" r="15"/><text class="room-label" x="${x0 + i * gap}" y="${n.y}">${esc(c)}</text>`;
      });
      s += `<text class="organ-sub" x="${n.x}" y="${n.y + 24}">${esc(n.tag)}</text>`;
      s += `<text class="organ-sub status" x="${n.x}" y="${n.y + 39}">${esc(n.status)}</text>`;
    } else if (hasLaw) {
      s += `<text class="organ-sub" x="${n.x}" y="${y0 + 17}">${esc(n.tag)}</text>`;
      s += `<text class="organ-law" x="${n.x}" y="${y0 + 33}">— ${esc(n.on_organ_short)} —</text>`;
      s += `<text class="organ-sub status" x="${n.x}" y="${y0 + 49}">${esc(n.status)}</text>`;
    } else {
      s += `<text class="organ-sub" x="${n.x}" y="${y0 + 18}">${esc(n.tag)}</text>`;
      s += `<text class="organ-sub status" x="${n.x}" y="${y0 + 35}">${esc(n.status)}</text>`;
    }
    s += '</g>';
  });
  s += `<g id="token" class="hidden${REDUCED ? ' no-travel' : ''}"><circle class="halo" r="14"/><circle r="7"/></g>`;
  s += '</svg>';
  stage.innerHTML = s;
  stage.querySelectorAll('.organ').forEach(g => {
    g.addEventListener('click', () => selectNode(g.dataset.id));
    g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectNode(g.dataset.id); } });
  });
  applyEmphasis();
  placeToken();
}

function applyEmphasis() {
  const sel = state.selected, f = state.filter;
  document.querySelectorAll('.edge').forEach(el => {
    const inFilter = f === 'all' || el.dataset.cls === f;
    const incident = !sel || el.dataset.from === sel || el.dataset.to === sel;
    el.classList.toggle('is-hidden', !(inFilter && incident));
    el.classList.toggle('lit', !!sel && inFilter && incident);
  });
  const adj = new Set();
  if (sel) DATA.edges.forEach(e => {
    if (f !== 'all' && e.class !== f) return;
    if (e.from === sel) adj.add(e.to); if (e.to === sel) adj.add(e.from);
  });
  document.querySelectorAll('.organ').forEach(g => {
    const id = g.dataset.id;
    g.classList.toggle('is-selected', id === sel);
    g.classList.toggle('is-dim', !!sel && id !== sel && !adj.has(id));
  });
}

function selectNode(id) {
  state.selected = state.selected === id ? null : id;
  applyEmphasis();
  const d = document.getElementById('detail');
  if (!state.selected) {
    d.innerHTML = '<div class="section-label">Organ</div><p class="muted" style="margin:0">Click an organ to read what it does, what it contributes, what constrains it, and how it can fail.</p>';
    return;
  }
  const n = NODES[id], w = n.witness || {};
  d.innerHTML = `<div class="section-label">${esc(n.kind === 'unbuilt' ? 'Unbuilt tissue — it does not exist' : n.kind === 'witness' ? 'Outside the membrane' : n.kind === 'center' ? 'Central tissue' : 'Organ')}</div>
    <p style="margin:0 0 2px"><strong>${esc(n.name)}</strong><br><span class="muted">${esc(n.tag)} · ${esc(n.status)}</span></p>
    ${n.on_organ ? `<p class="law">${esc(n.on_organ)}</p>` : ''}
    <dl class="fields" style="margin:0">
      <dt>What it does</dt><dd>${esc(n.does)}</dd>
      <dt>What it contributes</dt><dd>${esc(n.contributes)}</dd>
      <dt>What constrains it</dt><dd>${esc(n.constrained_by)}</dd>
      <dt>How it can fail</dt><dd>${esc(n.fails)}</dd>
      <dt>Implementation witness</dt><dd><code>${esc((w.routes || []).join(', ') || '—')}</code><br><code>${esc((w.modules || []).join(', ') || '—')}</code><br><code>${esc((w.tests || []).join(', '))}</code></dd>
    </dl>`;
  if (state.view === 'table') d.scrollIntoView({block: 'nearest'});
}

// ---- table view: the same data, for narrow screens and for reading -----
function renderTable() {
  const t = document.getElementById('table-view');
  t.innerHTML = `<table><thead><tr><th>Part · status</th><th>Relationships</th></tr></thead><tbody>` +
    DATA.nodes.map(n => `<tr data-id="${n.id}"><td><button class="link" onclick="selectNode('${n.id}')" style="text-align:left;font-weight:600">${esc(n.name)}</button><div class="foot">${esc(n.tag)}</div><div class="foot" style="color:var(--text)">${esc(n.status)}</div>${n.on_organ ? `<div class="law">${esc(n.on_organ)}</div>` : ''}</td><td>` +
      DATA.edges.filter(e => e.from === n.id).map(e => `<div><span class="swatch" style="border-color:var(--${e.class})"></span>${esc(CLS[e.class].label)} → ${esc(NODES[e.to].name)}${e.future ? ' <span class="muted">(future)</span>' : ''}</div>`).join('') + `</td></tr>`).join('') + `</tbody></table>`;
}
function setView(v, chosen) {
  // views switch; the current step does not
  state.view = v; if (chosen) state.viewChosen = true;
  document.getElementById('stage').classList.toggle('hidden', v !== 'diagram');
  document.getElementById('table-view').classList.toggle('hidden', v !== 'table');
  document.getElementById('view-diagram').classList.toggle('on', v === 'diagram');
  document.getElementById('view-table').classList.toggle('on', v === 'table');
  placeToken();
}
function fitView() {
  // the diagram needs room for its labels to stay legible; below that
  // width the table carries the same data (the step marker follows)
  const w = document.getElementById('stage').parentElement.clientWidth || 900;
  const note = document.getElementById('narrow-note');
  if (w < DATA.canvas.min_diagram_width) {
    note.textContent = 'The diagram needs about ' + DATA.canvas.min_diagram_width + 'px to keep its labels legible; the table below carries the same organs, laws, and pathways.';
    note.classList.remove('hidden');
    if (!state.viewChosen) setView('table', false);
  } else {
    note.classList.add('hidden');
    if (!state.viewChosen) setView('diagram', false);
  }
}

// ---- motion: nothing before a click; nothing loops ------------------------
function narrate() {
  const n = document.getElementById('narration'), st = document.getElementById('status');
  const steps = story().steps;
  if (state.step < 0) {
    n.innerHTML = '<p class="what">Dormant. Nothing moves until you press <strong>Set it in motion</strong>.</p><p class="forbid">The organism has elaborate internal capability, and nothing begins acting merely because it can.</p>';
    st.textContent = 'at rest';
    return;
  }
  const s = steps[state.step];
  n.innerHTML = `<p class="what"><span class="muted">${state.step + 1}/${steps.length} · ${esc(NODES[s.at].name)} —</span> ${esc(s.changed)}</p><p class="forbid">Forbidden from changing: ${esc(s.forbidden)}</p>`;
  st.textContent = state.step === steps.length - 1 ? 'finished — nothing loops; press Reset to return it to rest'
    : (state.running ? 'in motion' : 'paused');
}
function placeToken() {
  const tok = document.getElementById('token');
  document.querySelectorAll('#table-view tr[data-id]').forEach(tr => tr.classList.remove('at'));
  if (state.step < 0) { if (tok) tok.classList.add('hidden'); return; }
  const at = story().steps[state.step].at, n = NODES[at];
  if (tok) {
    tok.classList.remove('hidden');
    // a CSS transform transition carries the travel; reduced motion turns
    // the transition off, so a step change is discrete there
    tok.style.transform = `translate(${n.x}px, ${(n.y - n.h / 2 - 12).toFixed(1)}px)`;
  }
  const tr = document.querySelector(`#table-view tr[data-id="${at}"]`);
  if (tr) tr.classList.add('at');
}
function advance() {
  const steps = story().steps;
  state.timer = null;
  if (state.step >= steps.length - 1) { state.running = false; narrate(); return; }
  state.step += 1;
  placeToken();
  if (state.step >= steps.length - 1) { state.running = false; narrate(); return; }  // finished: no dangling timer
  narrate();
  state.timer = state.running ? setTimeout(advance, REDUCED ? 1200 : 1700) : null;
}
function setInMotion() {
  // the ONLY entry to motion, and it is a button
  if (state.running) return;
  if (state.step >= story().steps.length - 1) { narrate(); return; }
  state.running = true;
  advance();
}
function stepOnce() { pauseMotion(); advance(); }
function pauseMotion() { state.running = false; if (state.timer) { clearTimeout(state.timer); state.timer = null; } narrate(); }
function resetMotion() { pauseMotion(); state.step = -1; placeToken(); narrate(); }

// ---- boot: draw the dormant organism; start nothing ------------------------
renderTable();
render();
fitView();
narrate();
let _rt = null;
window.addEventListener('resize', () => { clearTimeout(_rt); _rt = setTimeout(fitView, 120); });
</script>
</body>
</html>
